name: perles_divines
description: Perles Divines — lecture et audio hors connexion
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.1
  just_audio: 0.10.6
  audio_service: 0.18.19
  audio_session: 0.2.4
  background_downloader: 9.6.2
  drift: 2.35.0
  drift_flutter: 0.3.1
  path_provider: 2.1.6
  path: 1.9.1
  crypto: 3.0.7
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.1
  webview_flutter_wkwebview: 3.26.1
  share_plus: 13.3.0
  url_launcher: 6.3.2
  connectivity_plus: 7.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.35.0
  build_runner: 2.16.1
flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/site/
    - assets/site/pages/
    - assets/site/assets/
    - assets/fixtures/
